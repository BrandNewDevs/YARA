name: Assistant checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: python -m pip install 'jsonschema>=4.22'
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec expo lint
      - run: pnpm test:assistant
      - run: pnpm test:domain
      - run: python -m unittest discover -s ml/tests -v
      - run: pnpm exec expo-doctor
      - run: pnpm exec expo export:embed --entry-file src/assistant/index.ts --platform android --dev false --bundle-output /tmp/assistant.android.bundle
