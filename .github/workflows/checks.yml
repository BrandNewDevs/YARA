name: Assistant checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: python -m pip install 'jsonschema>=4.22'
      - run: npx tsc --noEmit
      - run: npx expo lint
      - run: npm run test:assistant
      - run: python -m unittest discover -s ml/tests -v
      - run: npx expo-doctor
      - run: npx expo export:embed --entry-file src/assistant/index.ts --platform android --dev false --bundle-output /tmp/assistant.android.bundle
